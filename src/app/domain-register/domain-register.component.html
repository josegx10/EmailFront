<div class="container mt-5">
  <h2 class="mb-4">Nueva Solicitud de Dominio</h2>
  <form [formGroup]="domain" (ngSubmit)="RegisterDomain()">
      <div class="mb-3">
          <label for="companyName" class="form-label">Nombre de la Empresa</label>
          <input type="text" class="form-control" id="companyName" placeholder="Nombre de la Empresa" formControlName="name"  required>
      </div>
      <div class="mb-3">
          <label for="domainRequested" class="form-label">Dominio Solicitado</label>
          <input type="text" class="form-control" id="domainRequested" placeholder="ejemplo" formControlName="domain" required>
      </div>
      <div class="mb-3">
        <label for="domainRequested" class="form-label">Contraseña para el correo que se creara para acceder a la plataforma</label>
        <input type="password" class="form-control" id="domainRequested" placeholder="Contraseña" formControlName="password" required>
    </div>
      <div class="mb-3">
          <label for="requestNotes" class="form-label">Información</label>
          <textarea class="form-control" id="requestNotes" rows="3" placeholder="En este apartado no es necesario escribir nada, se compartira el correo para acceder con la contraseña proporcionada" formControlName="info" readonly></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
      <a href="" class="btn btn-secondary">Volver</a>
  </form>
</div>
